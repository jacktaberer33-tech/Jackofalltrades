# Only adds settings; the build command and publish folder stay as set in the Netlify UI.

# Payments go through Stripe on the live site (live keys are in Supabase's edge function secrets).
[context.production.environment]
  VITE_PAYMENTS_LIVE = "true"

# Deploy previews stay off: Supabase now holds live Stripe keys, so a preview would take real money.
# To test changes to payments, point Supabase at sandbox keys first, then switch this on.
[context.deploy-preview.environment]
  VITE_PAYMENTS_LIVE = "false"

# Any path that isn't a real file serves the app, so stray links (like an auth redirect to "/**")
# open the site instead of Netlify's 404 page. Real files (assets, images) are still served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
